<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <title>Reset Password</title>
    <style>
      .input { width: 100%; padding: 14px; border-radius: 12px; background: #1a1a1a; border: 1px solid #333; color: #fff; margin-top: 12px; }
      .btn { width: 100%; padding: 15px; border-radius: 14px; border: 0; background: #00e676; font-weight: 800; margin-top: 14px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="phone" style="padding:24px; min-height:100vh; display:flex; flex-direction:column; justify-content:center;">
      <h2 style="color:#fff">Reset Password</h2>
      <p style="color:#777; font-size:13px">Secure reset via SPS Server LIVE</p>
      
      <input id="email" class="input" placeholder="Email address" type="email" />
      <input id="otp" class="input" placeholder="Enter OTP Code" type="text" />
      <input id="newPass" class="input" placeholder="New Password (min 6 chars)" type="password" />
      
      <button id="resetBtn" class="btn">Reset Password Now</button>
      <button onclick="location.href='login.html'" class="btn" style="background:#222; color:#fff">Back to Login</button>
      <p id="msg" style="font-size:12px; text-align:center; margin-top:12px; display:none;"></p>
    </div>

    <script>
      document.getElementById("resetBtn").onclick = async () => {
        const email = document.getElementById("email").value.trim().toLowerCase();
        const otp = document.getElementById("otp").value.trim();
        const newPassword = document.getElementById("newPass").value.trim();
        const msg = document.getElementById("msg");

        if (!email || !otp || !newPassword) {
          msg.style.display = "block"; msg.style.color = "#ff5555";
          msg.innerText = "Fill all fields"; return;
        }

        msg.style.display = "block"; msg.style.color = "#00e676";
        msg.innerText = "Connecting to SPS Server...";

        try {
          const response = await fetch("https://sps-server.onrender.com/verifyOTPAndResetPassword", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, otp, newPassword })
          });
          
          const data = await response.json();
          
          if (data.success) {
            msg.style.color = "#00e676";
            msg.innerText = "✅ SUCCESS! Password updated. Login now.";
            setTimeout(()=> location.href='login.html', 2000);
          } else {
            msg.style.color = "#ff5555";
            msg.innerText = "❌ Error: " + (data.error || "Failed");
          }
        } catch (e) {
          msg.style.color = "#ff5555";
          msg.innerText = "❌ Server error: " + e.message;
        }
      };
    </script>
  </body>
</html>
