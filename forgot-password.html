<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <title>Reset Password</title>
    <style>
      .input {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        background: #1a1a1a;
        border: 1px solid #333;
        color: #fff;
        margin-top: 12px;
      }
      .btn {
        width: 100%;
        padding: 15px;
        border-radius: 14px;
        border: 0;
        background: #00e676;
        font-weight: 800;
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <div
      class="phone"
      style="
        padding: 24px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      "
    >
      <h2 style="color: #fff">Reset Password</h2>
      <p style="color: #777; font-size: 13px">
        Enter email and new password - will update Firestore directly (no email
        needed)
      </p>
      <input
        id="email"
        class="input"
        placeholder="Email address"
        type="email"
      />
      <input
        id="newPass"
        class="input"
        placeholder="New Password"
        type="password"
      />
      <button id="resetBtn" class="btn">Reset Password Now</button>
      <button
        onclick="location.href = 'login.html'"
        class="btn"
        style="background: #222; color: #fff"
      >
        Back to Login
      </button>
      <p
        id="msg"
        style="
          font-size: 12px;
          text-align: center;
          margin-top: 12px;
          display: none;
        "
      ></p>
    </div>
    <script type="module">
      import { db } from "./firebase.js";
      import {
        collection,
        query,
        where,
        getDocs,
        updateDoc,
        doc,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
      document.getElementById("resetBtn").onclick = async () => {
        const email = document
          .getElementById("email")
          .value.trim()
          .toLowerCase();
        const newPass = document.getElementById("newPass").value.trim();
        const msg = document.getElementById("msg");
        if (!email || !newPass) {
          msg.style.display = "block";
          msg.style.color = "#ff5555";
          msg.innerText = "Fill all";
          return;
        }
        msg.style.display = "block";
        msg.style.color = "#00e676";
        msg.innerText = "Searching...";
        const q = query(collection(db, "users"), where("email", "==", email));
        const snap = await getDocs(q);
        if (snap.empty) {
          msg.style.color = "#ff5555";
          msg.innerText = "No user found with this email";
          return;
        }
        const docId = snap.docs[0].id;
        await updateDoc(doc(db, "users", docId), { password: newPass });
        msg.style.color = "#00e676";
        msg.innerText =
          "✅ Password updated to: " +
          newPass +
          ". Now login with new password!";
      };
    </script>
  </body>
</html>
